<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ACT Analytics · Prototype A — Single column</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  /* Prototype A — single column: score row → distribution → skill gaps & students */
  .score-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .score-card {
    position: relative; height: 130px; padding: 16px; border: 1px solid var(--border); border-radius: var(--r-lg);
    background: var(--surface); cursor: pointer; text-align: left; font-family: inherit; color: inherit;
    transition: border-color 120ms ease, background 120ms ease, box-shadow 120ms ease;
  }
  .score-card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-sm); }
  .score-card.selected { background: var(--brand-subtle); border-color: var(--brand); box-shadow: inset 0 0 0 1px var(--brand); }
  .score-card .sc-top { display: flex; justify-content: space-between; align-items: flex-start; }
  .score-card .sc-label { font-size: var(--t-sm); font-weight: 500; line-height: var(--lh-sm); color: var(--text-secondary); }
  .score-card .sc-value { display: flex; align-items: baseline; gap: 4px; margin-top: 12px; }
  .score-card .sc-value b { font-size: 30px; font-weight: 700; line-height: 36px; letter-spacing: -0.02em; }
  .score-card .sc-value span { font-size: var(--t-sm); color: var(--text-tertiary); }
  .score-card .sc-foot { position: absolute; left: 16px; bottom: 16px; font-size: var(--t-xxs); line-height: var(--lh-xxs); color: var(--text-secondary); }

  .dist-card { margin-top: 16px; }
  .dist-header { display: flex; align-items: center; justify-content: space-between; height: 56px; padding: 0 16px; cursor: pointer; user-select: none; }
  .dist-header:hover { background: var(--surface-hover); border-radius: var(--r-lg); }
  .dist-meta { display: inline-flex; align-items: center; gap: 8px; color: var(--text-secondary); }
  .dist-meta .chev { color: var(--text-secondary); display: inline-flex; transition: transform 160ms ease; }
  .dist-card.open .dist-meta .chev { transform: rotate(180deg); }
  .dist-body { display: none; padding: 0 16px 16px; }
  .dist-card.open .dist-body { display: block; }
  .dist-summary { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; color: var(--text-secondary); margin: 0 0 8px; }
  .dist-summary b { color: var(--text-primary); font-weight: 600; }
  .dist-legend { margin-bottom: 20px; }

  .skills-card { margin-top: 16px; padding: 16px; }
  .skills-header { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 16px; }
  .skills-header .link-btn { margin-top: 2px; }
  .skill-list { display: flex; flex-direction: column; gap: 4px; }
  .skill-group { font-size: 11px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-tertiary); padding: 8px 8px 2px; }
  .skill-row {
    display: flex; align-items: center; height: 32px; padding: 0 8px; border-radius: var(--r-sm); cursor: pointer;
    transition: background 100ms ease;
  }
  .skill-row:hover { background: var(--surface-hover); }
  .skill-row.selected { background: var(--brand-subtle); }
  .skill-row .skill-name { flex: 1; display: flex; align-items: center; gap: 8px; min-width: 0; }
  .skill-row .skill-name .name { font-size: var(--t-sm); font-weight: 500; line-height: var(--lh-sm); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .skill-row.selected .skill-name .name { color: var(--text-brand); }
  .skill-row .skill-subj { font-size: var(--t-xxs); line-height: var(--lh-xxs); color: var(--text-secondary); white-space: nowrap; }
  .skill-row .skill-stat { display: inline-flex; align-items: center; gap: 4px; font-size: var(--t-sm); line-height: var(--lh-sm); color: var(--text-secondary); width: 170px; justify-content: flex-end; white-space: nowrap; }
  .skill-row .skill-stat .pct { font-weight: 600; color: var(--text-primary); }
  .skill-row .skill-stat .pct.warn { color: var(--warning); }
  .skill-row .skill-stat b { color: var(--text-primary); font-weight: 600; }
  .skill-row .marker { width: 16px; height: 16px; margin-left: 10px; color: var(--brand); display: inline-flex; align-items: center; justify-content: center; }

  .divider { height: 1px; background: var(--border); margin: 16px 0; }
  .chip-row { margin: -4px 0 12px; }
  .table-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .table-head .muted b { color: var(--text-primary); font-weight: 600; }
  .table-legend { margin-top: 12px; }
  .table-empty { border: 1px solid var(--border); border-radius: var(--r-md); }

  /* loading / error */
  .skel-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  .skel-card { height: 130px; border: 1px solid var(--border); border-radius: var(--r-md); padding: 16px; }
  .skel-card .skel { margin-bottom: 10px; }
  .skel-block { margin-top: 16px; border: 1px solid var(--border); border-radius: var(--r-md); padding: 16px; }
  .skel-line { height: 12px; }
  .state-card { margin-top: 0; min-height: 320px; display: flex; align-items: center; justify-content: center; }
</style>
</head>
<body>
<script src="shared.js"></script>
<script>
(function () {
  const A = window.ACT;
  const I = A.ICONS;
  const root = A.renderChrome();
  const subtitle = document.getElementById("panel-subtitle");

  const STATES = [
    { id: "default", label: "Default" },
    { id: "loading", label: "Loading" },
    { id: "failed", label: "Failed" },
    { id: "empty", label: "No scores" },
  ];
  // Deep-link params (optional): ?subject=science&dist=1&skill=sci-iod&all=1
  const q = new URLSearchParams(location.search);
  const state = {
    mode: A.stateFromHash(STATES, "default"),
    subject: A.subject(q.get("subject")) ? q.get("subject") : "english",
    distOpen: q.get("dist") === "1",
    seeAll: q.get("all") === "1",
    skillId: A.skill(q.get("skill")) ? q.get("skill") : null,
    sort: { col: null, dir: "asc" },
  };
  if (state.skillId) state.subject = A.skill(state.skillId).subject;

  function setMode(mode) {
    state.mode = mode;
    if (mode === "default") { state.subject = "english"; state.distOpen = false; state.seeAll = false; state.skillId = null; state.sort = { col: null, dir: "asc" }; }
    history.replaceState(null, "", mode === "default" ? location.pathname : "#" + mode);
    render();
  }

  A.renderProtoBar({
    label: "Prototype A",
    states: STATES,
    current: state.mode,
    links: [{ href: "v2-vertical-tabs.html", label: "Prototype B →" }],
    onChange: setMode,
  });

  // ---------- Renderers ----------
  function scoreRow() {
    return '<div class="score-row">' + A.SUBJECTS.map((s) => {
      const st = A.subjectStats(s.key);
      return '<button class="score-card' + (state.subject === s.key ? " selected" : "") + '" data-subject="' + s.key + '">' +
        '<div class="sc-top"><div><div class="sc-label">' + s.name + '</div><div class="sc-value"><b>' + st.avgText + "</b><span>/ 36</span></div></div>" +
        '<div class="subject-tile">' + I[s.icon](20) + "</div></div>" +
        '<div class="sc-foot">' + st.met + " of " + st.n + " met BM " + s.bm + "</div></button>";
    }).join("") + "</div>";
  }

  function distributionCard() {
    const st = A.subjectStats(state.subject);
    return '<div class="card dist-card' + (state.distOpen ? " open" : "") + '">' +
      '<div class="dist-header" id="dist-toggle"><div class="h-base">Score Distribution · ' + st.name + "</div>" +
      '<div class="dist-meta"><span>' + st.n + " students scored · BM " + st.bm + '</span><span class="chev">' + I.chevronDown(16) + "</span></div></div>" +
      '<div class="dist-body">' +
      `<div class="dist-summary"><span><b>${st.met}</b> at or above BM</span><span class="dot-sep">·</span><span><b>${st.below}</b> below</span><span class="dot-sep">·</span><span><b>${st.near}</b> of those within 3 pts</span><span class="dot-sep">·</span><span>Avg <b>${st.avgText}</b> vs BM <b class="brand-text">${st.bm}</b></span></div>` +
      '<div class="legend dist-legend"><span class="legend-item"><span class="swatch above"></span>Above BM</span><span class="legend-item"><span class="swatch bm"></span>Includes BM</span><span class="legend-item"><span class="swatch gray"></span>Below BM</span></div>' +
      '<div id="histogram"></div></div></div>';
  }

  function skillRow(sk) {
    const st = A.subjectStats(sk.subject);
    const sel = state.skillId === sk.id;
    return '<div class="skill-row' + (sel ? " selected" : "") + '" data-skill="' + sk.id + '" role="button" tabindex="0">' +
      '<div class="skill-name"><span class="name">' + sk.name + '</span><span class="skill-subj">· ' + st.name + "</span></div>" +
      '<div class="skill-stat"><span class="pct' + (sk.accuracy < 70 ? " warn" : "") + '">' + sk.accuracy + '%</span><span class="dot-sep">·</span><span><b>' + sk.weak.length + "</b> of " + st.n + " weak</span></div>" +
      '<div class="marker">' + (sel ? I.check(16) : "") + "</div></div>";
  }

  function skillsCard() {
    const st = A.subjectStats(state.subject);
    const sel = state.skillId ? A.skill(state.skillId) : null;
    let list;
    if (state.seeAll) {
      list = A.SUBJECTS.map((s) => '<div class="skill-group">' + s.name + "</div>" + A.SKILLS.filter((k) => k.subject === s.key).map(skillRow).join("")).join("");
    } else {
      list = A.SKILLS.filter((k) => k.subject === state.subject).map(skillRow).join("");
    }
    let tableHead, chip = "";
    if (sel) {
      const sst = A.subjectStats(sel.subject);
      chip = '<div class="chip-row"><span class="chip">' + sel.name + " · " + sst.name + " · <b>" + sel.weak.length + "</b> of " + sst.n + " students with " + A.withArticle(sst.name) + ' score<button class="chip-x" id="clear-skill" aria-label="Clear filter">' + I.x(12) + "</button></span></div>";
      tableHead = '<div class="table-head"><span class="h-sm">Students in this gap</span><span class="muted">click a column to sort</span></div>';
    } else {
      tableHead = '<div class="table-head"><span class="h-sm">All students</span><span class="muted"><b>' + A.STUDENTS.length + "</b> students · click a column to sort</span></div>";
    }
    return '<div class="card skills-card">' +
      '<div class="skills-header"><div><div class="h-base">Skill gaps &amp; students</div><div class="muted" style="margin-top:4px">' + st.name + " · click a row to filter the table below</div></div>" +
      '<button class="link-btn" id="see-all">' + (state.seeAll ? "Show less " + I.chevronUp(16) : "See all " + A.TOTAL_SKILLS + " " + I.chevronDown(16)) + "</button></div>" +
      '<div class="skill-list">' + list + "</div>" +
      '<div class="divider"></div>' + chip + tableHead +
      '<div id="table"></div><div id="legend" class="table-legend"></div></div>';
  }

  function renderDefault() {
    subtitle.textContent = A.SUMMARY;
    root.innerHTML = scoreRow() + distributionCard() + skillsCard();

    root.querySelectorAll(".score-card").forEach((b) => b.addEventListener("click", () => {
      const key = b.dataset.subject;
      if (state.subject === key) { state.distOpen = !state.distOpen; }
      else { state.subject = key; state.distOpen = true; state.skillId = null; }
      render();
    }));
    root.querySelector("#dist-toggle").addEventListener("click", () => { state.distOpen = !state.distOpen; render(); });
    if (state.distOpen) A.renderHistogram(root.querySelector("#histogram"), { subject: state.subject, showRange: true, maxBar: 92 });

    root.querySelector("#see-all").addEventListener("click", () => { state.seeAll = !state.seeAll; render(); });
    root.querySelectorAll(".skill-row").forEach((row) => {
      const act = () => {
        const id = row.dataset.skill;
        if (state.skillId === id) state.skillId = null;
        else { state.skillId = id; state.subject = A.skill(id).subject; }
        render();
      };
      row.addEventListener("click", act);
      row.addEventListener("keydown", (e) => { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); act(); } });
    });
    const clear = root.querySelector("#clear-skill");
    if (clear) clear.addEventListener("click", (e) => { e.stopPropagation(); state.skillId = null; render(); });

    const tableEl = root.querySelector("#table");
    const legendEl = root.querySelector("#legend");
    const sel = state.skillId ? A.skill(state.skillId) : null;
    if (sel && sel.weak.length === 0) {
      const sst = A.subjectStats(sel.subject);
      tableEl.innerHTML = '<div class="table-empty">' + A.emptyState({ mascot: "cheering", compact: true, title: "No students below the line", desc: "Everyone with " + A.withArticle(sst.name) + " score is at or above 70% on " + sel.name + "." }) + "</div>";
      legendEl.innerHTML = "";
      return;
    }
    const students = sel ? sel.weak.map(A.student) : A.STUDENTS;
    A.renderStudentTable(tableEl, {
      students,
      sort: state.sort,
      onSort: (s) => { state.sort = s; render(); },
    });
    A.renderLegend(legendEl);
  }

  function renderLoading() {
    subtitle.textContent = A.SUMMARY;
    const card = () => '<div class="skel-card"><div class="skel" style="width:56px;height:12px"></div><div class="skel" style="width:88px;height:28px"></div><div class="skel" style="width:120px;height:10px;margin-top:22px"></div></div>';
    root.innerHTML = '<div class="skel-row">' + card() + card() + card() + card() + "</div>" +
      '<div class="skel-block" style="display:flex;justify-content:space-between;align-items:center;height:58px;padding:0 16px"><div class="skel" style="width:180px;height:12px"></div><div class="skel" style="width:140px;height:12px"></div></div>' +
      '<div class="skel-block"><div class="skel" style="width:160px;height:14px"></div><div class="skel skel-line" style="width:260px;margin-top:8px;height:10px"></div>' +
      '<div style="margin-top:20px;display:flex;flex-direction:column;gap:12px">' + '<div class="skel skel-line" style="width:100%"></div>'.repeat(3) + "</div>" +
      '<div class="divider"></div><div class="skel" style="height:44px;border-radius:8px 8px 0 0"></div>' +
      '<div style="display:flex;flex-direction:column;gap:8px;margin-top:8px">' + '<div class="skel" style="height:29px"></div>'.repeat(8) + "</div></div>";
  }

  function renderFailed() {
    subtitle.textContent = A.SUMMARY;
    root.innerHTML = '<div class="card state-card">' + A.emptyState({ mascot: "uhoh", title: "Couldn't load analytics", desc: "Something went wrong while loading scores. Check your connection and try again.", action: { id: "retry", label: "Retry", icon: "refresh" } }) + "</div>";
    root.querySelector('[data-action="retry"]').addEventListener("click", () => { setMode("loading"); setTimeout(() => setMode("default"), 900); });
  }

  function renderEmpty() {
    subtitle.textContent = A.SUMMARY_EMPTY;
    root.innerHTML = '<div class="card state-card">' + A.emptyState({ mascot: "thankful", title: "No scores yet", desc: "Analytics appears once students submit and scoring completes." }) + "</div>";
  }

  function render() {
    if (state.mode === "loading") return renderLoading();
    if (state.mode === "failed") return renderFailed();
    if (state.mode === "empty") return renderEmpty();
    renderDefault();
  }
  render();
})();
</script>
</body>
</html>
