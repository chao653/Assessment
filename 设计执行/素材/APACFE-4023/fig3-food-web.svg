<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-label="Food web of a meadow ecosystem with 13 organisms">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#52525b"/></marker>
    <style>
      .b{fill:#fff;stroke:#3c2686;stroke-width:2}
      .p{fill:#ecfdf3;stroke:#15803d;stroke-width:2}
      .d{fill:#fff7ed;stroke:#c2410c;stroke-width:2}
      .n{font:600 17px Inter,Arial,sans-serif;fill:#18181b}
      .s{font:13px Inter,Arial,sans-serif;fill:#52525b}
      .l{stroke:#52525b;stroke-width:1.6;fill:none;marker-end:url(#a)}
      .h{font:700 24px Inter,Arial,sans-serif;fill:#18181b}
      .c{font:14px Inter,Arial,sans-serif;fill:#52525b}
    </style>
  </defs>
  <rect width="1400" height="900" fill="#fff"/>
  <text x="40" y="52" class="h">Figure 3. Meadow food web</text>
  <text x="40" y="80" class="c">Arrows point from the organism that is eaten to the organism that eats it. Numbers show average population per hectare in June.</text>

  <g>
    <rect class="b" x="590" y="120" width="220" height="64" rx="10"/><text x="700" y="148" class="n" text-anchor="middle">Red-tailed hawk</text><text x="700" y="170" class="s" text-anchor="middle">Tertiary consumer &#183; 0.1</text>
    <rect class="b" x="170" y="270" width="200" height="64" rx="10"/><text x="270" y="298" class="n" text-anchor="middle">Garter snake</text><text x="270" y="320" class="s" text-anchor="middle">Secondary consumer &#183; 4</text>
    <rect class="b" x="600" y="270" width="200" height="64" rx="10"/><text x="700" y="298" class="n" text-anchor="middle">Red fox</text><text x="700" y="320" class="s" text-anchor="middle">Secondary consumer &#183; 0.3</text>
    <rect class="b" x="1030" y="270" width="200" height="64" rx="10"/><text x="1130" y="298" class="n" text-anchor="middle">Leopard frog</text><text x="1130" y="320" class="s" text-anchor="middle">Secondary consumer &#183; 22</text>
    <rect class="b" x="60" y="440" width="190" height="64" rx="10"/><text x="155" y="468" class="n" text-anchor="middle">Field mouse</text><text x="155" y="490" class="s" text-anchor="middle">Primary consumer &#183; 60</text>
    <rect class="b" x="330" y="440" width="190" height="64" rx="10"/><text x="425" y="468" class="n" text-anchor="middle">Cottontail rabbit</text><text x="425" y="490" class="s" text-anchor="middle">Primary consumer &#183; 12</text>
    <rect class="b" x="600" y="440" width="190" height="64" rx="10"/><text x="695" y="468" class="n" text-anchor="middle">Grasshopper</text><text x="695" y="490" class="s" text-anchor="middle">Primary consumer &#183; 9,000</text>
    <rect class="b" x="870" y="440" width="190" height="64" rx="10"/><text x="965" y="468" class="n" text-anchor="middle">Monarch caterpillar</text><text x="965" y="490" class="s" text-anchor="middle">Primary consumer &#183; 400</text>
    <rect class="b" x="1140" y="440" width="190" height="64" rx="10"/><text x="1235" y="468" class="n" text-anchor="middle">Cricket</text><text x="1235" y="490" class="s" text-anchor="middle">Primary consumer &#183; 5,500</text>
    <rect class="p" x="150" y="640" width="220" height="64" rx="10"/><text x="260" y="668" class="n" text-anchor="middle">Seeds and grain</text><text x="260" y="690" class="s" text-anchor="middle">Producer</text>
    <rect class="p" x="530" y="640" width="220" height="64" rx="10"/><text x="640" y="668" class="n" text-anchor="middle">Meadow grass</text><text x="640" y="690" class="s" text-anchor="middle">Producer</text>
    <rect class="p" x="910" y="640" width="220" height="64" rx="10"/><text x="1020" y="668" class="n" text-anchor="middle">Milkweed</text><text x="1020" y="690" class="s" text-anchor="middle">Producer</text>
    <rect class="d" x="530" y="790" width="340" height="64" rx="10"/><text x="700" y="818" class="n" text-anchor="middle">Fungi and soil bacteria</text><text x="700" y="840" class="s" text-anchor="middle">Decomposers &#183; break down dead matter from every level</text>
  </g>

  <g>
    <path class="l" d="M260 640L170 506"/><path class="l" d="M290 640L400 506"/>
    <path class="l" d="M600 640L450 506"/><path class="l" d="M650 640L690 506"/><path class="l" d="M720 640L1210 506"/>
    <path class="l" d="M1010 640L970 506"/>
    <path class="l" d="M155 440L250 336"/><path class="l" d="M200 440L620 336"/><path class="l" d="M440 440L660 336"/>
    <path class="l" d="M700 440L1060 336"/><path class="l" d="M1220 440L1160 336"/><path class="l" d="M960 440L1110 336"/>
    <path class="l" d="M1050 300L372 300"/>
    <path class="l" d="M270 270L600 172"/><path class="l" d="M700 270L700 186"/><path class="l" d="M140 440L590 160"/><path class="l" d="M420 440L640 186"/>
  </g>
</svg>
