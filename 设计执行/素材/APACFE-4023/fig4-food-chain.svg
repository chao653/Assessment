<rect width="640" height="1160" fill="#fff"/>
<text x="40" y="52" class="h">Figure 4. Meadow food chain</text>
<text x="40" y="80" class="c">Arrows point from the organism that is eaten</text>
<text x="40" y="100" class="c">to the organism that eats it.</text>
<rect class="b" x="170" y="150" width="300" height="72" rx="10"/><text x="320" y="181" class="n" text-anchor="middle">Red-tailed hawk</text><text x="320" y="204" class="s" text-anchor="middle">Tertiary consumer · 0.1</text>
<rect class="b" x="170" y="340" width="300" height="72" rx="10"/><text x="320" y="371" class="n" text-anchor="middle">Garter snake</text><text x="320" y="394" class="s" text-anchor="middle">Secondary consumer · 4</text>
<rect class="b" x="170" y="530" width="300" height="72" rx="10"/><text x="320" y="561" class="n" text-anchor="middle">Leopard frog</text><text x="320" y="584" class="s" text-anchor="middle">Secondary consumer · 22</text>
<rect class="b" x="170" y="720" width="300" height="72" rx="10"/><text x="320" y="751" class="n" text-anchor="middle">Grasshopper</text><text x="320" y="774" class="s" text-anchor="middle">Primary consumer · 9,000</text>
<rect class="p" x="170" y="910" width="300" height="72" rx="10"/><text x="320" y="941" class="n" text-anchor="middle">Meadow grass</text><text x="320" y="964" class="s" text-anchor="middle">Producer</text>
